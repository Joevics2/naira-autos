<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C10"/>
      <stop offset="60%" stop-color="#0B1015"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="block" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232b33"/>
      <stop offset="100%" stop-color="#171d23"/>
    </linearGradient>
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9edf1"/>
      <stop offset="100%" stop-color="#c7ced6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Engine block silhouette -->
  <g transform="translate(280,150)">
    <!-- cylinder bank bumps -->
    <rect x="40" y="0" width="90" height="60" rx="10" fill="url(#block)" stroke="#333d47" stroke-width="2"/>
    <rect x="150" y="0" width="90" height="60" rx="10" fill="url(#block)" stroke="#333d47" stroke-width="2"/>
    <rect x="260" y="0" width="90" height="60" rx="10" fill="url(#block)" stroke="#333d47" stroke-width="2"/>
    <rect x="370" y="0" width="90" height="60" rx="10" fill="url(#block)" stroke="#333d47" stroke-width="2"/>
    <!-- main block body -->
    <rect x="0" y="50" width="520" height="220" rx="18" fill="url(#block)" stroke="#333d47" stroke-width="3"/>
    <!-- bolt details -->
    <circle cx="35" cy="90" r="7" fill="#0d1117" stroke="#3a4650" stroke-width="2"/>
    <circle cx="485" cy="90" r="7" fill="#0d1117" stroke="#3a4650" stroke-width="2"/>
    <circle cx="35" cy="230" r="7" fill="#0d1117" stroke="#3a4650" stroke-width="2"/>
    <circle cx="485" cy="230" r="7" fill="#0d1117" stroke="#3a4650" stroke-width="2"/>

    <!-- stamped ID plate -->
    <g transform="translate(120,150)">
      <rect x="0" y="0" width="280" height="86" rx="6" fill="url(#plate)" stroke="#8b95a1" stroke-width="2"/>
      <text x="140" y="38" text-anchor="middle" font-family="monospace" font-size="30" font-weight="700" fill="#0d1117">2JZ-GTE</text>
      <text x="140" y="66" text-anchor="middle" font-family="monospace" font-size="15" letter-spacing="2" fill="#3a4650">ENGINE NO.</text>
    </g>

    <!-- magnifying glass over the plate -->
    <g transform="translate(300,120)">
      <circle cx="0" cy="0" r="58" fill="#0ea5e9" fill-opacity="0.08" stroke="#38bdf8" stroke-width="6"/>
      <line x1="41" y1="41" x2="88" y2="88" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
      <path d="M -26 4 L -8 22 L 30 -16" stroke="#4ade80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="1" fill="#ffffff" style="text-transform:uppercase">Engine Number Analyzer</text>
  <text x="600" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#9aa5b1">Free engine code lookup &amp; decoder — Naira Autos</text>

  <!-- badge -->
  <rect x="500" y="540" width="200" height="34" rx="17" fill="#0ea5e9"/>
  <text x="600" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="1">100% FREE</text>
</svg>
